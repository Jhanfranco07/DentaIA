# Action SHAs: checkout v6, setup-node v6, setup-python v6.1.0; artifacts v4.
name: Security
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: {}
  workflow_call: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  dependencias:
    name: Dependencias JavaScript · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/assert-dev-only-picomatch.mjs
    # Track the unpatched development-only advisory without declaring it resolved.
    # This risk exception is documented in docs/security/PICOMATCH_CVE_2026_112366.md.
    - name: Auditoría completa (diagnóstico de dependencias de desarrollo)
      shell: bash
      run: |
        npm audit > /tmp/dentaia-npm-audit-full.txt 2>&1 || audit_status=$?
        cat /tmp/dentaia-npm-audit-full.txt
        if [ "${audit_status:-0}" -ne 0 ]; then
          echo "::warning title=Riesgo de desarrollo pendiente::GHSA-fc5q-39xc-vjpf sigue sin parche. Ver issue #77. La auditoría completa no es el gate de producción."
        fi
    - name: Auditoría bloqueante de dependencias de producción
      run: npm audit --omit=dev
  sast:
    name: SAST · Semgrep local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install semgrep==1.185.0
        mkdir -p reports
        # --error falla ante hallazgos; security-summary.py también falla ante errores del analizador.
        # Evitar --strict: Semgrep puede devolver código 3 por avisos del CLI sin hallazgos.
        scan_status=0
        semgrep scan --config .github/security/semgrep.yml --error --metrics off --disable-version-check --json --output reports/semgrep.json src services/dental-vision/app || scan_status=$?
        python - <<'PY'
        import json
        from pathlib import Path
        p = Path('reports/semgrep.json')
        if p.exists():
            report = json.loads(p.read_text())
            print('Semgrep JSON diagnostic:', json.dumps({'results_count': len(report.get('results', [])), 'errors': report.get('errors', []), 'skipped_rules': report.get('skipped_rules', [])}, ensure_ascii=False)[:6000])
        else:
            print('Semgrep did not produce a JSON report')
        PY
        python scripts/ci/security-summary.py reports/semgrep.json
        test "$scan_status" -eq 0
  secretos:
    name: Secretos · Gitleaks OSS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: bash scripts/ci/gitleaks.sh
  configuracion:
    name: Configuración · YAML, permisos y actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install PyYAML==6.0.3
        python scripts/ci/validate-workflows.py
        bash scripts/ci/actionlint.sh
  python:
    name: Dependencias Python · pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install pip-audit==2.10.1
        pip-audit --progress-spinner off -r services/dental-vision/requirements.txt
  hallazgos:
    name: Consolidación de hallazgos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - dependencias
    - sast
    - secretos
    - configuracion
    - python
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
  quality-gate:
    name: Security · Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - dependencias
    - sast
    - secretos
    - configuracion
    - python
    - hallazgos
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
