name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Revisar vulnerabilidades de todas las dependencias
        run: npm audit
