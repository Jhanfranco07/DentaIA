name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas automatizadas con Node.js
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Preparar Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      # Incluye las pruebas actuales y futuras de los módulos del equipo.
      # Reservar *.test.mjs para pruebas aisladas sin red ni credenciales.
      # Las integraciones reales deben usar otra convención y ejecutarse aparte.
      - name: Ejecutar pruebas aisladas
        shell: bash
        run: |
          mapfile -d '' tests < <(find src/features src/app -name '*.test.mjs' ! -name '*integracion.test.mjs' -print0)
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test --test-reporter=tap "${tests[@]}"
