# Action SHAs: checkout v6, setup-node v6, setup-python v6.1.0; artifacts v4.
name: DevSecOps
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  ci:
    name: CI · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs ci.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  tests:
    name: Tests · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs tests.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  security:
    name: Security · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs security.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  backend:
    name: Backend IA · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs backend-ia.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  rutinas-sql:
    name: Rutinas · PostgreSQL y permisos RLS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prueba-local-sintetica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: prueba-local-sintetica
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Crear datos ficticios en PostgreSQL temporal
        run: psql -v ON_ERROR_STOP=1 -f scripts/qa/rutinas/01_entorno_sintetico.sql
      - name: Verificar esquema y políticas RLS
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/DI-207-propuesta-esquema-rutinas.sql
      - name: Verificar operaciones transaccionales
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/DI-207-operaciones-transaccionales.sql
      - name: Verificar consultas autorizadas
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/DI-207-consultas-autorizadas.sql
      - name: Probar consentimiento, acceso cruzado, progreso y revocación
        run: psql -v ON_ERROR_STOP=1 -f scripts/qa/rutinas/02_pruebas_rls.sql
  validacion-final:
    name: Validación final
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - ci
    - tests
    - security
    - backend
    - rutinas-sql
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
