# Action SHAs: checkout v6, setup-node v6, setup-python v6.1.0; artifacts v4.
name: DevSecOps
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  ci:
    name: CI · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs ci.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  tests:
    name: Tests · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs tests.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  security:
    name: Security · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs security.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  backend:
    name: Backend IA · observar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/observe.mjs backend-ia.yml
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
  validacion-final:
    name: Validación final
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - ci
    - tests
    - security
    - backend
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
