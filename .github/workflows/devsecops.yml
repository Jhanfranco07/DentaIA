# DevSecOps centralizado: se ejecutan aquí las verificaciones REALES una sola vez.
# Los workflows especializados quedan disponibles solo mediante workflow_dispatch.
name: DevSecOps · Pipeline integral
'on':
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
    - feat/di-211-rfdetr-premium
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  ci-preparacion:
    name: Checkout · instalación y lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: git diff --exit-code -- package.json package-lock.json

  ci-typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run typecheck

  ci-lint:
    name: Análisis estático configurado
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ci-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/lint.mjs

  ci-build:
    name: Build Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - ci-typescript
    - ci-lint
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: npm run build

  ci-validacion-final:
    name: CI · Validación final
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - ci-preparacion
    - ci-typescript
    - ci-lint
    - ci-build
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  tests-preparacion:
    name: Preparar inventario de suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: |-
        node scripts/ci/node-tests.mjs --inventory
        node --test scripts/ci/*.test.mjs

  tests-unitarias:
    name: Unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/node-tests.mjs unitarias
    - name: Stripe Sandbox tests
      run: npm test
    - name: Premium catalog tests
      run: npm run test:planes
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: node-unitarias
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  tests-integracion:
    name: Integracion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/node-tests.mjs integracion
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: node-integracion
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  tests-contratos:
    name: Contratos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/node-tests.mjs contratos
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: node-contratos
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  tests-regresion:
    name: Regresion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: tests-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/node-tests.mjs regresion
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: node-regresion
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  tests-playwright:
    name: Playwright · rutas públicas aisladas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: tests-preparacion
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci --include=optional
    - name: Verificar SWC Linux antes de aislar Next.js
      run: |-
        node -e "const fs = require('node:fs'); const path = 'node_modules/@next/swc-linux-x64-gnu/next-swc.linux-x64-gnu.node'; if (!fs.existsSync(path)) throw new Error('Falta SWC Linux fijado en package-lock.json')"
    - name: Instalar Chromium fijado por el lockfile y sus dependencias
      run: ./node_modules/.bin/playwright install --with-deps chromium
    - name: Verificar guarda de red
      run: node --test e2e/isolation/*.test.cjs
    - name: Ejecutar suite pública aislada
      run: npm run test:e2e
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ failure() }}
      with:
        name: playwright-fallos
        path: |-
          playwright-report/
          test-results/
        if-no-files-found: error
        retention-days: 7

  tests-resumen:
    name: Tests · Resumen y Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - tests-preparacion
    - tests-unitarias
    - tests-integracion
    - tests-contratos
    - tests-regresion
    - tests-playwright
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  sec-dependencias:
    name: Dependencias JavaScript · npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22'
        cache: npm
    - run: npm ci
    - run: node scripts/ci/assert-dev-only-picomatch.mjs
    # Track the unpatched development-only advisory without declaring it resolved.
    # This risk exception is documented in docs/security/PICOMATCH_CVE_2026_112366.md.
    - name: Auditoría completa (diagnóstico de dependencias de desarrollo)
      shell: bash
      run: |
        npm audit > /tmp/dentaia-npm-audit-full.txt 2>&1 || audit_status=$?
        cat /tmp/dentaia-npm-audit-full.txt
        if [ "${audit_status:-0}" -ne 0 ]; then
          echo "::warning title=Riesgo de desarrollo pendiente::GHSA-fc5q-39xc-vjpf sigue sin parche. Ver issue #77. La auditoría completa no es el gate de producción."
        fi
    - name: Auditoría bloqueante de dependencias de producción
      run: npm audit --omit=dev

  sec-sast:
    name: SAST · Semgrep local
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install semgrep==1.185.0
        mkdir -p reports
        semgrep scan --config .github/security/semgrep.yml --error --strict --metrics off --disable-version-check --json --output reports/semgrep.json src services/dental-vision/app services/rfdetr-premium/app
        python scripts/ci/security-summary.py reports/semgrep.json

  sec-secretos:
    name: Secretos · Gitleaks OSS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: bash scripts/ci/gitleaks.sh

  sec-configuracion:
    name: Configuración · YAML, permisos y actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install PyYAML==6.0.3
        python scripts/ci/validate-workflows.py
        bash scripts/ci/actionlint.sh

  sec-python:
    name: Dependencias Python · pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install pip-audit==2.10.1
        pip-audit --progress-spinner off -r services/dental-vision/requirements.txt

  sec-imagen-rfdetr:
    name: Imagen RF-DETR · CVE de sistema y Python
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Probar política de bloqueo de imagen
      run: python -m unittest discover -s scripts/ci -p 'test_rfdetr_image_gate.py' -v
    - name: Construir imagen local sin pesos ni publicación
      run: |-
        docker build --pull=false --tag dentaia-rfdetr-ci:local services/rfdetr-premium
        mkdir -p reports
    - name: Escanear imagen completa sin exclusiones
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        version: v0.76.2
        scan-type: image
        image-ref: dentaia-rfdetr-ci:local
        format: json
        output: reports/rfdetr-image.json
        # JSON stays available to the next fail-closed gate even when findings exist.
        exit-code: '0'
        ignore-unfixed: 'false'
        vuln-type: os,library
        scanners: vuln
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        list-all-pkgs: 'true'
    - name: Gate de revisión PR · excepción acotada pendiente de aprobación
      if: ${{ github.event_name == 'pull_request' && (github.base_ref != 'feat/di-211-rfdetr-premium' || github.head_ref != 'feat/di-211-railway-qa' || github.event.pull_request.head.repo.full_name != 'Jhanfranco07/DentaIA') }}
      run: python scripts/ci/rfdetr-image-gate.py --mode review reports/rfdetr-image.json
    - name: ImageID de la imagen escaneada (requerido para DI211_QA_APPROVAL_JSON)
      if: ${{ github.event_name == 'pull_request' && github.base_ref == 'feat/di-211-rfdetr-premium' && github.head_ref == 'feat/di-211-railway-qa' && github.event.pull_request.head.repo.full_name == 'Jhanfranco07/DentaIA' }}
      run: python -c "import json,sys; r=json.load(open('reports/rfdetr-image.json')); print('ImageID:', r.get('Metadata',{}).get('ImageID','NOT FOUND'))"
    - name: Gate QA Railway · aceptación temporal de imagen exacta
      if: ${{ github.event_name == 'pull_request' && github.base_ref == 'feat/di-211-rfdetr-premium' && github.head_ref == 'feat/di-211-railway-qa' && github.event.pull_request.head.repo.full_name == 'Jhanfranco07/DentaIA' }}
      env:
        DI211_QA_APPROVAL_JSON: ${{ vars.DI211_QA_APPROVAL_JSON }}
      run: python scripts/ci/rfdetr-image-gate.py --mode qa --policy docs/security/DI211_RAILWAY_QA_EXCEPTIONS.json reports/rfdetr-image.json
    - name: Gate de despliegue · imagen vulnerable bloqueada
      if: ${{ github.event_name != 'pull_request' }}
      run: python scripts/ci/rfdetr-image-gate.py --mode deploy reports/rfdetr-image.json
    - name: Conservar reporte completo de Trivy sin pesos
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rfdetr-image-trivy
        path: reports/rfdetr-image.json
        if-no-files-found: error
        retention-days: 7

  sec-hallazgos:
    name: Consolidación de hallazgos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - sec-dependencias
    - sec-sast
    - sec-secretos
    - sec-configuracion
    - sec-python
    - sec-imagen-rfdetr
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  sec-quality-gate:
    name: Security · Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - sec-dependencias
    - sec-sast
    - sec-secretos
    - sec-configuracion
    - sec-python
    - sec-imagen-rfdetr
    - sec-hallazgos
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  ia-preparacion:
    name: Python · resolución y pip check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: python -m pip install -r services/dental-vision/requirements.txt pytest==8.3.5
    - run: python -m pip check
    - run: python --version

  ia-fastapi:
    name: FastAPI · Smile V17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ia-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: python -m pip install -r services/dental-vision/requirements.txt pytest==8.3.5
    - run: python -m pip check
    - run: |-
        mkdir -p reports
        cd services/dental-vision
        python -m pytest tests/test_smile_api_auth.py -q --junitxml=../../reports/fastapi.xml
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: backend-fastapi
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  ia-contratos:
    name: Contratos /health y /analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ia-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: python -m pip install -r services/dental-vision/requirements.txt pytest==8.3.5
    - run: python -m pip check
    - run: |-
        mkdir -p reports
        cd services/dental-vision
        python -m pytest tests/test_smile_api_auth.py -k "remote_mode_rejects_analyze_without_the_service_secret" -q --junitxml=../../reports/contratos.xml
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: backend-contratos
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  ia-autenticacion:
    name: Autenticación y errores
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ia-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: python -m pip install -r services/dental-vision/requirements.txt pytest==8.3.5
    - run: python -m pip check
    - run: |-
        mkdir -p reports
        cd services/dental-vision
        python -m pytest tests/test_smile_api_auth.py -k "remote_mode_does_not_start_with_a_short_service_secret" -q --junitxml=../../reports/autenticacion.xml
    - run: python scripts/ci/test-summary.py reports/*.xml
      if: ${{ always() }}
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: backend-autenticacion
        path: reports/*.xml
        if-no-files-found: error
        retention-days: 7

  ia-seguridad:
    name: Seguridad backend · Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ia-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: |-
        python -m pip install bandit==1.9.4
        bandit -r services/dental-vision/app services/rfdetr-premium/app -ll

  ia-rfdetr:
    name: RF-DETR · contrato, autorizacion y manifiesto (sin pesos)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ia-preparacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: services/dental-vision/requirements.txt
    - run: python -m pip install -r services/dental-vision/requirements.txt httpx2==2.16.2
    - run: python -m pip check
    - run: python scripts/ci/check-rfdetr-lock.py
    - run: |-
        cd services/rfdetr-premium
        python -m unittest discover -s tests -v

  ia-validacion-final:
    name: Backend IA · Validación final
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - ia-preparacion
    - ia-fastapi
    - ia-contratos
    - ia-autenticacion
    - ia-seguridad
    - ia-rfdetr
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  rutinas-sql:
    name: Rutinas · PostgreSQL y permisos RLS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prueba-local-sintetica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: prueba-local-sintetica
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Crear datos ficticios en PostgreSQL temporal
        run: psql -v ON_ERROR_STOP=1 -f scripts/qa/rutinas/01_entorno_sintetico.sql
      - name: Verificar esquema y políticas RLS
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/DI-207-propuesta-esquema-rutinas.sql
      - name: Verificar operaciones transaccionales
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/DI-207-operaciones-transaccionales.sql
      - name: Verificar consultas autorizadas
        run: psql -v ON_ERROR_STOP=1 -f docs/sql/DI-207-consultas-autorizadas.sql
      - name: Probar consentimiento, acceso cruzado, progreso y revocación
        run: psql -v ON_ERROR_STOP=1 -f scripts/qa/rutinas/02_pruebas_rls.sql

  directorio-sql:
    name: Contactos y citas · PostgreSQL y permisos RLS
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: prueba-local-sintetica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: postgres
      PGUSER: postgres
      PGPASSWORD: prueba-local-sintetica
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preparar identidades y citas ficticias
        run: psql -v ON_ERROR_STOP=1 -f scripts/qa/rutinas/01_entorno_sintetico.sql
      - name: Aplicar restricciones de contacto
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261122180000_dentist_contact_channels.sql
      - name: Aplicar flujo de citas verificadas
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261122181000_solicitudes_reales_y_resenas.sql
      - name: Probar WhatsApp, consentimiento, RLS, citas y transición
        run: psql -v ON_ERROR_STOP=1 -f scripts/qa/directorio/01_contacto_citas.sql
      - name: Probar odontograma, persistencia, consentimiento y RLS
        shell: bash
        run: |
          createdb dentaia_di213_ci
          node scripts/qa-di213-postgres.mjs --sql | psql -d dentaia_di213_ci -v ON_ERROR_STOP=1

  integridad-aplicacion:
    name: Integración · calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - ci-validacion-final
    - tests-resumen
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Exigir todas las verificaciones anteriores
      run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  integridad-seguridad:
    name: Integración · análisis de seguridad e IA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - sec-quality-gate
    - ia-validacion-final
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Exigir todas las verificaciones anteriores
      run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  integridad-datos:
    name: Integración · privacidad PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - rutinas-sql
    - directorio-sql
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Exigir todas las verificaciones anteriores
      run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  devsecops-final:
    name: DevSecOps · Validación final integral
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
    - integridad-aplicacion
    - integridad-seguridad
    - integridad-datos
    if: ${{ always() }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - name: Exigir todas las verificaciones anteriores
      run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}

  entrega-commit:
    name: Confirmar commit y rama
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - devsecops-final
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: |-
        git rev-parse HEAD
        git diff --exit-code

  entrega-publicacion:
    name: Publicación existente · Vercel y Railway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - entrega-commit
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/deployment.mjs
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

  entrega-disponibilidad:
    name: Comprobación pública de Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
    - entrega-publicacion
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: node scripts/ci/deployment.mjs --smoke
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        TARGET_EVENT: ${{ github.event_name }}
        TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

  entrega-promocion-externa:
    name: Production · autorización externa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    needs:
    - entrega-disponibilidad
    steps:
    - run: echo "Production no se publica desde Actions. Promoción fuera de este workflow, después de revisión y autorización."
        >> "$GITHUB_STEP_SUMMARY"

  entrega-resultado:
    name: CD · Resultado de observación
    runs-on: ubuntu-latest
    timeout-minutes: 20

    if: ${{ always() }}
    needs:
    - entrega-commit
    - entrega-publicacion
    - entrega-disponibilidad
    - entrega-promocion-externa
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - run: python scripts/ci/summary.py --gate
      env:
        NEEDS_JSON: ${{ toJSON(needs) }}
