name: DevSecOps
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencias:
    name: Lockfile y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
  typescript:
    name: TypeScript
    needs: dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
  unitarias:
    name: Pruebas aisladas
    needs: dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas aisladas existentes
        shell: bash
        run: |
          mapfile -d '' tests < <(find src/features src/app -name '*.test.mjs' ! -name '*integracion.test.mjs' -print0)
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test --test-reporter=tap "${tests[@]}"
  integracion:
    name: Integración local simulada
    needs: dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas de integración con dobles locales
        shell: bash
        run: |
          mapfile -d '' tests < <(find src/features -name '*integracion.test.mjs' -print0)
          test "${#tests[@]}" -gt 0
          node --experimental-strip-types --test --test-reporter=tap "${tests[@]}"
  pruebas-fastapi:
    name: Pruebas FastAPI aisladas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/dental-vision
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            services/dental-vision/requirements-onnx.txt
            services/dental-vision/requirements-linux-tests.txt
      - name: Instalar dependencias fijadas del runtime y pruebas
        run: python -m pip install -r requirements-onnx.txt -r requirements-linux-tests.txt
      - name: Comprobar resolución de dependencias
        run: python -m pip check
      - name: Ejecutar pruebas sin inferencia real ni descarga del modelo
        run: python -m pytest -m 'not real' -q
  auditoria:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm audit
  build:
    name: Build Next.js
    if: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/feature/') }}
    needs: [typescript, unitarias, integracion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
  validacion-final:
    name: Validación final
    if: ${{ always() }}
    needs: [dependencias, typescript, unitarias, integracion, pruebas-fastapi, auditoria, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Comprobar verificaciones obligatorias
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_FEATURE_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/') }}
        shell: bash
        run: |
          echo '## Validación DevSecOps' >> "$GITHUB_STEP_SUMMARY"
          echo '| Job | Resultado |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' >> "$GITHUB_STEP_SUMMARY"
          printf '%s' "$NEEDS_JSON" | jq -e --arg feature "$IS_FEATURE_PUSH" '
            all(to_entries[]; .value.result == "success" or
              ($feature == "true" and .key == "build" and .value.result == "skipped"))
          ' >/dev/null || { echo '::error::Una verificación obligatoria falló, se canceló o se omitió.'; exit 1; }
